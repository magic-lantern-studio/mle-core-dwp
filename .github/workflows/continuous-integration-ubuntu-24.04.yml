name: Continuous Integration Build (Ubuntu 24.04)

on:
  workflow_dispatch:  # Allow manual triggers
  push:
    branches: [ "master" ]

env:
  MLE_ROOT: ${{ github.workspace }}/MagicLantern

jobs:
  ubuntu-build:
    name: Ubuntu 24.04 Build (${{ matrix.build_type }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [ Release, Debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config

      # Download the latest mle-core-math artifact into $MLE_ROOT. It contains
      # both the mle-core-math and mle-core-util libraries and headers.
      - name: Download mle-core-math artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download \
            --repo magic-lantern-studio/mle-core-math \
            --name mle-core-math-ubuntu-24.04-${{ matrix.build_type }} \
            --dir "$MLE_ROOT"
          ls -R "$MLE_ROOT"

      - name: Configure
        run: >
          cmake -S DigitalWorkprint/lib/linux -B build_${{ matrix.build_type }}
          -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_INSTALL_PREFIX="$MLE_ROOT"
          -DCMAKE_PREFIX_PATH="$MLE_ROOT"

      # Built serially: DwpChecker links libDWP by file path, not by target.
      - name: Build
        run: cmake --build build_${{ matrix.build_type }}

      - name: Install into MLE_ROOT
        run: cmake --install build_${{ matrix.build_type }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mle-core-dwp-ubuntu-24.04-${{ matrix.build_type }}
          path: ${{ env.MLE_ROOT }}
