name: Continuous Integration Build (Windows, Visual Studio 2022)

on:
  workflow_dispatch:  # Allow manual triggers
  push:
    branches: [ "master" ]

env:
  MLE_ROOT: C:\opt\MagicLantern
  # DWP.vcxproj post-build copies headers from $(MLE_HOME)\DigitalWorkprint\...
  MLE_HOME: ${{ github.workspace }}

jobs:
  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Add msbuild to Path
        uses: microsoft/setup-msbuild@v2
        with:
            msbuild-architecture: x64
      # Download the latest mle-core-math artifact into %MLE_ROOT%. It contains
      # both the mle-core-math and mle-core-util libraries and headers.
      - name: Download mle-core-math artifacts
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir %MLE_ROOT%
          gh run download --repo magic-lantern-studio/mle-core-math --name mle-core-math-windows-Release --dir %MLE_ROOT%
          dir /s /b %MLE_ROOT%
      - name: Build with msbuild
        shell: cmd
        run: |
          cd DigitalWorkprint\lib\win32\build\msvc17
          msbuild DwpAccess.sln /p:Configuration=Release /p:Platform=x64
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mle-core-dwp-windows-Release
          path: ${{ env.MLE_ROOT }}
